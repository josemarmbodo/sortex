# ===============================================================
#  SORTEX v1.2 — Default configuration.
#  File: config.toml
#  Encoding: UTF-8
# NOTE: Change this file force embedding data base rebuilding.
# ===============================================================

[meta]
version = "1.2.0"
description = "Sortex default configuration embedding."

# Folders that scanner must be ignore. 
# It is recomended includes project folders mainly if you are a developer. 

[DB_consultation_process]
# You can change this value, thinking in your hardware conditions.
# This value is optmized to single-core machines.
chunk_size = 1000


[folder_processing]
ignore = [
    '__pycache__', 'node_modules', '.git', '.svn', '.hg',
    '.venv', 'venv', 'env', '.env',
    '.idea', '.vscode',
    'dist', 'build', 'target', 'out', 'output',
    '.pytest_cache', '.mypy_cache', '__pypackages__', '.tox', '.eggs', '*.egg-info',
    '.gradle', '.nx', '.next', '.nuxt',
    '.parcel-cache', '.turbo', '.cache', 'cache',
    'coverage', '.coverage', 'htmlcov', 
    'tmp', 'temp',
    '.DS_Store', 'Thumbs.db', 'desktop.ini'
]


[extensions]

Simple_Text = ['.txt', '.hash']

